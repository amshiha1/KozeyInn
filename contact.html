    <body>
        <header>
            <h1><a href="index.html">KozeyInn</a></h1>
            <div class="hero-wrapper">
                <nav class="navbar">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="accommodations.html">Accommodations</a></li>
                    <li><a href="#contact.html">Contact</a></li>
                </ul>
                </nav>
            </div>
            <div class="hero-image">
                <img src="images/swiss-valley.jpg" alt="A bright green mountain-hill covered in pine trees with a blue river flowing in the center" width="1440" height="560">
            </div>
        </header>

        <main>
            <section id="contact">
                <h2>Contact Us</h2>
                <p> Please reach out to us with any questions or concerns. <br> We are happy to help you plan your dream vacation with us!</p>

                <img src="images/swiss-peak.jpg" alt="Mountain with snow in the distance with pine trees and grass down the hill and a river flowing" width="350" height="455">
                <form action="https://wp.zybooks.com/form-viewer.php" method="POST" target="_blank">

                    <label for="full-name">Full Name<span class="required">*</span></label> 
                    <input type="text" name="full-name" id="full-name" required>

                    <label for="my-email">Email address<span class="required">*</span></label> 
                    <input type="email" name="my-email" id="my-email" required>

                    <label for="my-phone">Phone Number<span class="required">*</span></label> 
                    <input type="tel" name="my-phone" id="my-phone" required>

                    <fieldset>
                        <legend>Preferred Method of Contact<span class="required">*</span></legend> 
                        <input type="radio" name="contact-pref" id="pref-email" value="prefer-email" required checked> 
                        <label for="pref-email">Email</label> 

                        <input type="radio" name="contact-pref" id="pref-phone" value="prefer-phone"> 
                        <label for="pref-phone">Phone</label> 
                    </fieldset>

                    <label for="my-comments">Comments<span class="required">*</span></label>
                    <textarea name="my-comments" id="my-comments" required></textarea>

                    <input type="submit" name="my-submit" id="my-submit" value="Submit">
                </form>
            </section>
        </main>


        <footer>
            <p>Copyright &copy;2023 - KozeyInn</p>

        </footer>
